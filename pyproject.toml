[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-ts"
version = "0.1.0"
description = "Offline, vendor-independent minimum futures product coverage"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "polars>=1.44,<1.45",
  "tzdata>=2025.1",
]

[project.urls]
Repository = "https://github.com/fordjam/contract-coverage"
Documentation = "https://github.com/fordjam/contract-coverage/blob/main/docs/product-coverage.md"
Issues = "https://github.com/fordjam/contract-coverage/issues"

[project.optional-dependencies]
databento = [
  "databento>=0.86,<0.88",
  "databento-dbn>=0.69,<0.70",
  "numpy>=1.26,<3",
]

test = ["pytest>=8,<10", "zstandard>=0.23,<1"]
release = ["build>=1.2,<2", "twine>=6,<7", "ruff>=0.12,<1", "setuptools>=77"]

[project.scripts]
futures-ts = "futures_ts.cli:main"
product-coverage = "product_coverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futures_ts = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
