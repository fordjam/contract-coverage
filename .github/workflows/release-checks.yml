name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Generic core / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    env:
      POLARS_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/validation.txt ".[test]"
      - name: Assert vendor SDKs are absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('databento') is None; assert importlib.util.find_spec('databento_dbn') is None"
      - name: Offline generic tests
        run: python -m pytest tests/test_product_coverage.py tests/test_release_hardening.py -q -k "not futures_ts_bridge"

  artifacts:
    name: Built artifacts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/validation.txt ".[release]" "pip-audit==2.10.1"
      - run: python -m build --no-isolation
      - name: Check package metadata
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'twine', 'check',
                          *map(str, Path('dist').iterdir())], check=True)
      - name: Fresh wheel and sdist, no source imports, synthetic runtime only
        run: python tools/artifact_smoke.py --dist dist --work out/artifact-validation
      - name: Audit exact installed public dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip -r out/artifact-validation/wheel/installed-requirements.txt
      - name: Lint new package and release tools
        run: ruff check --select F,E9,B,E501 src/product_coverage tools tests/test_release_hardening.py

  secrets:
    name: Reachable history and source secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify pinned scanner and scan with full redaction
        run: python tools/secret_scan.py
