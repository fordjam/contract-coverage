name: Futures time series

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      POLARS_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        run: python -m pip install ".[test]"
      - name: Generated DBN and offline integration tests
        run: python -m pytest tests/ -q
      - name: Standalone selector compatibility
        run: python contract_coverage.py --self-test
      - name: Installed CLI smoke checks
        run: |
          python -m tests.generate_fixtures --out out/ci-source
          futures-ts build --src out/ci-source --out out/ci-series --roots CL --workers 2
          futures-ts coverage --out out/ci-series
          futures-ts check --out out/ci-series
      - name: Synthetic memory workload
        if: runner.os == 'Linux'
        run: python -m tests.benchmark_synthetic --work out/ci-memory --scale 5
